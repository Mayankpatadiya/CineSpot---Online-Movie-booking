<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinema Profile - Provider Portal</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div class="dashboard-wrapper">
    <!-- Sidebar -->
    <aside class="dashboard-sidebar">
      <div class="sidebar-header">
        <a class="sidebar-brand" href="../index.html">
          <span class="brand-badge"><i class="bi bi-film"></i></span>
          <span>Cine<span class="text-danger">Spots</span></span>
        </a>
        <span class="sidebar-role-tag role-tag-provider">Provider</span>
      </div>

      <ul class="sidebar-nav">
        <li class="nav-section-title">Operations</li>
        <li class="sidebar-item">
          <a class="sidebar-link" href="dashboard.html">
            <i class="bi bi-speedometer2"></i> Overview
          </a>
        </li>
        <li class="sidebar-item">
          <a class="sidebar-link" href="shows.html">
            <i class="bi bi-calendar-event"></i> Manage Shows
          </a>
        </li>
        <li class="sidebar-item">
          <a class="sidebar-link" href="bookings.html">
            <i class="bi bi-journal-text"></i> Cinema Bookings
          </a>
        </li>
        <li class="sidebar-item">
          <a class="sidebar-link active" href="cinema.html">
            <i class="bi bi-building-gear"></i> Cinema Profile
          </a>
        </li>
        <li class="sidebar-item">
          <a class="sidebar-link" href="analytics.html">
            <i class="bi bi-graph-up-arrow"></i> Revenue Analytics
          </a>
        </li>

        <li class="nav-section-title">Switch Mode</li>
        <li class="sidebar-item">
          <a class="sidebar-link" href="../index.html">
            <i class="bi bi-house-door"></i> Customer Storefront
          </a>
        </li>
      </ul>

      <div class="sidebar-footer">
        <div class="d-flex align-items-center justify-content-between">
          <div class="d-flex align-items-center gap-2">
            <div class="nav-user-avatar">MV</div>
            <div class="overflow-hidden">
              <div class="fw-bold small text-truncate">Marcus Vance</div>
              <div class="text-muted" style="font-size: 0.72rem;">Cinema Partner</div>
            </div>
          </div>
          <button class="btn btn-sm btn-link text-danger p-0" onclick="CineAuth.logout()" title="Sign Out">
            <i class="bi bi-box-arrow-right fs-5"></i>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="dashboard-main">
      <header class="dashboard-topbar">
        <h2 class="h5 fw-bold text-dark mb-0">Cinema Information & Facilities</h2>
      </header>

      <div class="dashboard-body">
        <div class="card p-4 border-subtle bg-white shadow-xs" style="max-width: 800px;">
          <form onsubmit="event.preventDefault(); CineProvider.saveCinemaProfile();">
            <div class="mb-3">
              <label for="prov-cinema-name" class="form-label small fw-bold text-dark">Cinema Complex Name</label>
              <input type="text" id="prov-cinema-name" class="form-control" required>
            </div>

            <div class="mb-3">
              <label for="prov-cinema-location" class="form-label small fw-bold text-dark">Physical Street Address</label>
              <input type="text" id="prov-cinema-location" class="form-control" required>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-12 col-sm-6">
                <label for="prov-cinema-phone" class="form-label small fw-bold text-dark">Box Office Contact Number</label>
                <input type="tel" id="prov-cinema-phone" class="form-control" required>
              </div>
              <div class="col-12 col-sm-6">
                <label for="prov-cinema-email" class="form-label small fw-bold text-dark">Manager Inquiries Email</label>
                <input type="email" id="prov-cinema-email" class="form-control" required>
              </div>
            </div>

            <div class="mb-4">
              <label for="prov-cinema-hours" class="form-label small fw-bold text-dark">Operating Hours</label>
              <input type="text" id="prov-cinema-hours" class="form-control" placeholder="e.g. 09:30 AM - 01:00 AM" required>
            </div>

            <div class="mb-4">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <label class="form-label small fw-bold text-dark mb-0">Amenities & Auditorium Facilities</label>
                <button type="button" class="btn btn-sm btn-outline-danger" onclick="CineProvider.addFacilityPrompt()">
                  <i class="bi bi-plus-lg me-1"></i> Add Facility
                </button>
              </div>
              <div id="prov-facilities-list">
                <!-- Facility pills -->
              </div>
            </div>

            <button type="submit" class="btn btn-cine-primary">
              <i class="bi bi-check2-circle me-1"></i> Save Cinema Profile
            </button>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/validation.js"></script>
  <script src="../js/provider.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      CineProvider.initCinemaProfilePage();
    });
  </script>
</body>
</html>
